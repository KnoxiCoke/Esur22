name: R2I Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2i-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire tryptase renderer and calculator
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path("script.js").read_text(encoding="utf-8")
          old = (
              "  function renderTryptase() {\n"
              "    if (!tryptaseOutput) return;\n"
              "    if (!tryptaseOutput.dataset.ready) {\n"
              "      tryptaseOutput.innerHTML = `\n"
              "        <div class=\"hint\">${escapeHtml(t(\"tryptase_default\"))}</div>\n"
              "        <div class=\"hint\" style=\"margin-top:10px\">${escapeHtml(t(\"tryptase_formula\"))}</div>\n"
              "      `;\n"
              "    }\n"
              "  }\n"
              "\n"
              "  function calcTryptase() {\n"
              "    if (!tryptaseOutput) return;\n"
              "\n"
              "    const baselineRaw = document.getElementById(\"baseline\")?.value?.trim() ?? \"\";\n"
              "    const acuteRaw = document.getElementById(\"acute\")?.value?.trim() ?? \"\";\n"
              "\n"
              "    if (baselineRaw === \"\" || acuteRaw === \"\") {\n"
              "      tryptaseOutput.innerHTML = `<div class=\"hint\">${escapeHtml(t(\"tryptase_invalid\"))}</div>`;\n"
              "      return;\n"
              "    }\n"
              "\n"
              "    const baseline = Number(baselineRaw);\n"
              "    const acute = Number(acuteRaw);\n"
              "\n"
              "    if (!Number.isFinite(baseline) || !Number.isFinite(acute) || baseline < 0 || acute < 0) {\n"
              "      tryptaseOutput.innerHTML = `<div class=\"hint\">${escapeHtml(t(\"tryptase_invalid\"))}</div>`;\n"
              "      return;\n"
              "    }\n"
              "\n"
              "    const threshold = (1.2 * baseline) + 2;\n"
              "    const significant = acute >= threshold;\n"
              "\n"
              "    tryptaseOutput.innerHTML = `\n"
              "      <div><strong>${escapeHtml(t(\"tryptase_threshold\"))}:</strong> ${fmt(threshold)} ng/mL</div>\n"
              "      <div><strong>${escapeHtml(t(\"tryptase_acute\"))}:</strong> ${fmt(acute)} ng/mL</div>\n"
              "      <div><strong>${escapeHtml(t(\"tryptase_baseline\"))}:</strong> ${fmt(baseline)} ng/mL</div>\n"
              "      <div class=\"hint\" style=\"margin-top:10px\">${escapeHtml(t(\"tryptase_formula\"))}</div>\n"
              "      <div style=\"margin-top:10px\"><strong>${escapeHtml(significant ? t(\"tryptase_positive\") : t(\"tryptase_negative\"))}</strong></div>\n"
              "      <div class=\"hint\" style=\"margin-top:10px\">${escapeHtml(t(\"tryptase_note\"))}</div>\n"
              "    `;\n"
              "\n"
              "    tryptaseOutput.dataset.ready = \"1\";\n"
              "  }\n"
              "\n"
          )
          new = (
              "  const { renderTryptase, calcTryptase } = window.ESUR.hsr.tryptase.init({\n"
              "    t,\n"
              "    escapeHtml,\n"
              "    fmt,\n"
              "    tryptaseOutput\n"
              "  });\n"
              "\n"
          )
          if script.count(old) != 1:
              raise SystemExit("tryptase block count=%s" % script.count(old))
          script = script.replace(old, new, 1)
          if "window.ESUR.hsr.tryptase.init" not in script:
              raise SystemExit("missing init")
          if "function renderTryptase" in script or "function calcTryptase" in script:
              raise SystemExit("declaration still present")
          if "(1.2 * baseline) + 2" in script:
              raise SystemExit("formula still in host")
          if "delete tryptaseOutput.dataset.ready" not in script:
              raise SystemExit("reset ready delete missing")
          Path("script.js").write_text(script, encoding="utf-8")

          index = Path("index.html").read_text(encoding="utf-8")
          if "./js/hsr/tryptase.js" not in index:
              old_i = (
                  '<script src="./js/hsr/switch.js"></script>\n'
                  '<script src="./script.js"></script>'
              )
              new_i = (
                  '<script src="./js/hsr/switch.js"></script>\n'
                  '<script src="./js/hsr/tryptase.js"></script>\n'
                  '<script src="./script.js"></script>'
              )
              if index.count(old_i) != 1:
                  raise SystemExit("index script block not found")
              Path("index.html").write_text(index.replace(old_i, new_i, 1), encoding="utf-8")
          PY
          grep -F "window.ESUR.hsr.tryptase.init" script.js
          grep -F "./js/hsr/tryptase.js" index.html
          if grep -F "function renderTryptase" script.js; then exit 1; fi
          if grep -F "function calcTryptase" script.js; then exit 1; fi
      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r2i-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html .github/workflows/r2i-wire.yml
          git commit -m "ESUR_REFACTOR_R2I: extract tryptase renderer and calculator"
          git push origin HEAD:refactor/modularize-script
