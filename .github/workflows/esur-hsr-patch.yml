name: ESUR HSR approved patches

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/esur-hsr-patch.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore script.js and apply approved patches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 1d11323919a0c94b480ec0ed87458b555cf65ecd:script.js > script.js
          test "$(wc -c < script.js)" -gt 100000
          python3 tools/apply_approved_hsr_blocks.py mild
          git add script.js
          git commit -m "ACUTE_MILD_01: align mild_general EN/DE with ESUR Part 1 Table 3"
          python3 tools/apply_approved_hsr_blocks.py urt
          git add script.js
          git commit -m "ACUTE_MOD_URT_01: align moderate urticaria/erythema EN/DE with ESUR Part 1 Table 3"
          rm -f .github/workflows/esur-hsr-patch.yml
          rm -f tools/apply_approved_hsr_blocks.py
          rmdir tools || true
          git add -A .github/workflows/esur-hsr-patch.yml tools
          git commit -m "Remove temporary HSR patch workflow and helper"
          git push
