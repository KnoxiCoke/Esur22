name: Apply NIHR decision module

on:
  push:
    branches:
      - codex/nihr-decision-module

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nihr-decision-module
      - name: Apply patch
        run: |
          cat .github/nihr-patch/part-*.b64 > /tmp/nihr.patch.b64
          base64 -d /tmp/nihr.patch.b64 > /tmp/nihr.patch
          git apply /tmp/nihr.patch
      - name: Validate JavaScript syntax
        run: node --check script.js
      - name: Commit changes and remove workflow
        run: |
          rm -rf .github/nihr-patch .github/workflows/apply-nihr-decision-module.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js .github/nihr-patch .github/workflows/apply-nihr-decision-module.yml
          git commit -m "Implement ESUR NIHR decision module"
          git push
