name: Apply NIHR decision module

on:
  push:
    branches:
      - codex/nihr-decision-module

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nihr-decision-module
      - name: Patch NIHR module
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(
              index,
              "Previous-reaction planning, acute management, empiric switch support, tryptase interpretation and delayed reaction check.",
              "Previous-reaction planning, acute management, empiric switch support, tryptase interpretation and NIHR decision support.",
              "index HSR subtitle",
          )
          index = replace_once(
              index,
              '<button class="seg__btn" data-hsr-tab="nihr" type="button" data-i18n="hsr_nihr_tab">Delayed reaction check</button>',
              '<button class="seg__btn" data-hsr-tab="nihr" type="button" data-i18n="hsr_nihr_tab">NIHR</button>',
              "index NIHR tab label",
          )
          old_nihr_section = '''    <!-- HSR: NIHR -->
    <section class="subview" id="hsr-tab-nihr" hidden>
      <div class="card">
        <div class="card__title" data-i18n="nihr_cmtype_title">Contrast type</div>
        <div class="seg">
          <button class="seg__btn active" data-seg="nihrCmtype" data-value="icm" type="button" data-i18n="icm_ct">ICM (CT)</button>
          <button class="seg__btn" data-seg="nihrCmtype" data-value="gbca" type="button" data-i18n="gbca_mri">GBCA (MRI)</button>
        </div>
      </div>

      <div class="card">
        <div class="card__title" data-i18n="red_flags">Danger signs</div>
        <div class="checklist">
          <label><input type="checkbox" class="nihr-check" value="blister" /> <span data-i18n="blistering">Blistering</span></label>
          <label><input type="checkbox" class="nihr-check" value="mucosa" /> <span data-i18n="mucosal_involvement">Mucosal involvement</span></label>
          <label><input type="checkbox" class="nihr-check" value="erosion" /> <span data-i18n="erosions">Erosions</span></label>
          <label><input type="checkbox" class="nihr-check" value="hemorrhagic" /> <span data-i18n="hemorrhagic_lesions">Hemorrhagic lesions</span></label>
          <label><input type="checkbox" class="nihr-check" value="skin_disruption" /> <span data-i18n="skin_disruption">Skin disruption</span></label>
          <label><input type="checkbox" class="nihr-check" value="fever" /> <span data-i18n="fever">High fever</span></label>
          <label><input type="checkbox" class="nihr-check" value="organ_values" /> <span data-i18n="organ_values">Abnormal liver / kidney values</span></label>
          <label><input type="checkbox" class="nihr-check" value="lymphadenopathy" /> <span data-i18n="lymphadenopathy">Lymphadenopathy</span></label>
        </div>
      </div>

      <div class="card card--output">
        <div class="card__title" data-i18n="assessment">Assessment</div>
        <div class="output" id="nihrOutput"></div>
      </div>
    </section>'''
          new_nihr_section = '''    <!-- HSR: NIHR -->
    <section class="subview" id="hsr-tab-nihr" hidden>
      <div class="card card--subtle">
        <div class="card__title" data-i18n="nihr_title">NIHR — non-immediate hypersensitivity reactions</div>
        <div class="output hint" data-i18n="nihr_subtitle">
          Use this module for previous delayed / non-immediate skin reactions after contrast media when re-administration is being considered. Screen for danger signs suggesting SCAR and follow the ESUR prevention pathway.
        </div>
      </div>

      <div class="card">
        <div class="card__title" data-i18n="nihr_severity_title">Previous NIHR severity</div>
        <div class="seg seg--stack">
          <button class="seg__btn active" data-seg="nihrSeverity" data-value="mild" type="button" data-i18n="nihr_severity_mild">Mild skin reaction</button>
          <button class="seg__btn" data-seg="nihrSeverity" data-value="moderate" type="button" data-i18n="nihr_severity_moderate">Moderate skin reaction</button>
          <button class="seg__btn" data-seg="nihrSeverity" data-value="severe" type="button" data-i18n="nihr_severity_severe">Severe skin reaction / SCAR</button>
        </div>
        <div class="hint" style="margin-top:10px" data-i18n="nihr_severity_hint">
          Mild: resolves without treatment. Moderate: resolves with outpatient treatment. Severe: hospital admission required.
        </div>
      </div>

      <div class="card">
        <div class="card__title" data-i18n="nihr_culprit_class_title">Previous culprit contrast class</div>
        <div class="seg">
          <button class="seg__btn active" data-seg="nihrCmtype" data-value="icm" type="button" data-i18n="icm_ct">ICM (CT)</button>
          <button class="seg__btn" data-seg="nihrCmtype" data-value="gbca" type="button" data-i18n="gbca_mri">GBCA (MRI)</button>
        </div>
      </div>

      <div class="card">
        <div class="card__title" data-i18n="nihr_culprit_known_title">Culprit contrast medium known?</div>
        <div class="seg">
          <button class="seg__btn active" data-seg="nihrCulpritKnown" data-value="known" type="button" data-i18n="nihr_culprit_known">Culprit CM known</button>
          <button class="seg__btn" data-seg="nihrCulpritKnown" data-value="unknown" type="button" data-i18n="nihr_culprit_unknown">Culprit CM unknown</button>
        </div>
      </div>

      <div class="card">
        <div class="card__title" data-i18n="nihr_danger_signs_title">Danger signs for SCAR</div>
        <div class="checklist">
          <label><input type="checkbox" class="nihr-check" value="erosion" /> <span data-i18n="erosions">Erosive and/or haemorrhagic lesions</span></label>
          <label><input type="checkbox" class="nihr-check" value="blister" /> <span data-i18n="blistering">Blistering</span></label>
          <label><input type="checkbox" class="nihr-check" value="skin_disruption" /> <span data-i18n="skin_disruption">Skin disruption / skin barrier disruption</span></label>
          <label><input type="checkbox" class="nihr-check" value="mucosa" /> <span data-i18n="mucosal_involvement">Mucosal involvement</span></label>
          <label><input type="checkbox" class="nihr-check" value="fever" /> <span data-i18n="fever">High fever</span></label>
          <label><input type="checkbox" class="nihr-check" value="organ_values" /> <span data-i18n="organ_values">Abnormal liver / kidney values</span></label>
          <label><input type="checkbox" class="nihr-check" value="lymphadenopathy" /> <span data-i18n="lymphadenopathy">Lymphadenopathy</span></label>
        </div>
      </div>

      <div class="card card--output">
        <div class="card__title" data-i18n="nihr_recommendation_title">NIHR recommendation</div>
        <div class="output" id="nihrOutput"></div>
      </div>

      <div class="card card--subtle">
        <div class="card__title" data-i18n="nihr_safety_note_title">Safety note</div>
        <div class="output" data-i18n="nihr_safety_note">
          ESUR-based support for previous NIHR. Consider contrast media cross-reactivity and increased NIHR risk with iso-osmolar dimeric iodine-based contrast media. Follow local protocols and drug allergy specialist advice.
        </div>
      </div>
    </section>'''
          index = replace_once(index, old_nihr_section, new_nihr_section, "index NIHR section")
          index_path.write_text(index, encoding="utf-8", newline="\n")

          script_path = Path("script.js")
          script = script_path.read_text(encoding="utf-8")
          script = replace_once(script, '    nihrCmtype: "icm",\n    acuteSeverity: "mild",', '    nihrCmtype: "icm",\n    nihrSeverity: "mild",\n    nihrCulpritKnown: "known",\n    acuteSeverity: "mild",', "state NIHR fields")
          script = replace_once(script, 'hsr_subtitle: "Previous-reaction planning, acute management, empiric switch support, tryptase interpretation and delayed reaction check."', 'hsr_subtitle: "Previous-reaction planning, acute management, empiric switch support, tryptase interpretation and NIHR decision support."', "EN HSR subtitle")
          script = replace_once(script, 'hsr_nihr_tab: "Delayed reaction check"', 'hsr_nihr_tab: "NIHR"', "EN NIHR tab")
          script = replace_once(script, 'hsr_subtitle: "Planung nach früherer Reaktion, Akutmanagement, empirische Switch-Hilfe, Tryptase-Interpretation und Spätreaktions-Check."', 'hsr_subtitle: "Planung nach früherer Reaktion, Akutmanagement, empirische Switch-Hilfe, Tryptase-Interpretation und NIHR-Entscheidungshilfe."', "DE HSR subtitle")
          script = replace_once(script, 'hsr_nihr_tab: "Spätreaktions-Check"', 'hsr_nihr_tab: "NIHR"', "DE NIHR tab")

          def replace_nihr_i18n(text, start_marker, new_block, label):
              start = text.index(start_marker)
              end = text.index('\n\n      icm_hint:', start)
              return text[:start] + new_block + text[end:]

          en_block = '''      nihr_title: "NIHR — non-immediate hypersensitivity reactions",
      nihr_subtitle:
        "Use this module for previous delayed / non-immediate skin reactions after contrast media when re-administration is being considered. Screen for danger signs suggesting SCAR and follow the ESUR prevention pathway.",
      nihr_severity_title: "Previous NIHR severity",
      nihr_severity_mild: "Mild skin reaction",
      nihr_severity_moderate: "Moderate skin reaction",
      nihr_severity_severe: "Severe skin reaction / SCAR",
      nihr_severity_hint:
        "Mild: resolves without treatment. Moderate: resolves with outpatient treatment. Severe: hospital admission required.",
      nihr_culprit_class_title: "Previous culprit contrast class",
      nihr_culprit_known_title: "Culprit contrast medium known?",
      nihr_culprit_known: "Culprit CM known",
