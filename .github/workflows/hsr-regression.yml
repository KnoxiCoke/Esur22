name: HSR Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: true

jobs:
  hsr-regression:
    name: HSR Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run HSR regression tests
        run: npm test
