name: Apply PREV_IHR_UNCLEAR_CLEANUP_01

on:
  push:
    paths:
      - ".github/workflows/apply-prev-ihr-unclear-cleanup-01.yml"
      - "tools/apply_prev_ihr_unclear_cleanup_01.py"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply PREV_IHR_UNCLEAR_CLEANUP_01
        run: python3 tools/apply_prev_ihr_unclear_cleanup_01.py

      - name: Commit approved cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "script.js unchanged"
            exit 1
          fi
          git commit -m "PREV_IHR_UNCLEAR_CLEANUP_01: remove unreachable elective_unclear/emergency_unclear dead code from script.js"

      - name: Remove temporary helper and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_prev_ihr_unclear_cleanup_01.py
          rm -f .github/workflows/apply-prev-ihr-unclear-cleanup-01.yml
          rmdir tools 2>/dev/null || true
          git add -A
          git commit -m "Remove temporary PREV_IHR_UNCLEAR_CLEANUP_01 helper and workflow"
          git push
