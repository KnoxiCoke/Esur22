name: Apply washout guard patch

on:
  push:
    branches:
      - codex/washout-no-enhancement-guard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add adrenal washout no-enhancement guard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/washout-no-enhancement-guard
      - name: Patch script.js
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('script.js')
          data = path.read_bytes()
          data = data.replace(
              b'      washout_invalid: "Please enter valid numeric HU values.",\n      washout_invalid_formula: "Washout calculation is not possible with these values. Check the HU inputs.",',
              '      washout_invalid: "Please enter valid numeric HU values.",\n      washout_no_enhancement: "No relevant enhancement pattern (Enhanced HU ≤ Unenhanced HU). Classical adrenal washout calculation is not applicable. Check ROI placement, phase selection and HU values.",\n      washout_invalid_formula: "Washout calculation is not possible with these values. Check the HU inputs.",'.encode(),
          )
          data = data.replace(
              '      washout_invalid: "Bitte gültige numerische HU-Werte eingeben.",\n      washout_invalid_formula: "Mit diesen Werten ist keine sinnvolle Washout-Berechnung möglich. Bitte die HU-Eingaben prüfen.",'.encode(),
              '      washout_invalid: "Bitte gültige numerische HU-Werte eingeben.",\n      washout_no_enhancement: "Kein plausibles Enhancement-Muster (KM-HU ≤ Nativ-HU). Eine klassische Nebennieren-Washout-Berechnung ist nicht sinnvoll anwendbar. ROI-Platzierung, Phase und HU-Werte prüfen.",\n      washout_invalid_formula: "Mit diesen Werten ist keine sinnvolle Washout-Berechnung möglich. Bitte die HU-Eingaben prüfen.",'.encode(),
          )
          data = data.replace(
              b'    const absDenominator = enhanced - unenhanced;\n    const relDenominator = enhanced;',
              b'    if (enhanced <= unenhanced) {\n      washoutOutput.innerHTML = `<div class="hint">${escapeHtml(t("washout_no_enhancement"))}</div>`;\n      return;\n    }\n\n    const absDenominator = enhanced - unenhanced;\n    const relDenominator = enhanced;',
          )
          path.write_bytes(data)

          workflow = Path('.github/workflows/codex-washout-guard.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/codex-washout-guard.yml
          git commit -m "Add adrenal washout no-enhancement guard" || exit 0
          git push
