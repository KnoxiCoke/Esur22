name: R2F Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2f-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire static i18n apply shell
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path("script.js").read_text(encoding="utf-8")
          old_t = (
              "  function t(key) {\n"
              "    return i18n[state.lang][key];\n"
              "  }\n"
              "\n"
          )
          new_init = (
              "  const { t, applyStaticTranslations } = window.ESUR.app.i18nApply.init({\n"
              "    state,\n"
              "    i18n,\n"
              "    escapeHtml: window.ESUR.utils.escapeHtml,\n"
              "    changesSearchInput\n"
              "  });\n"
              "\n"
          )
          if script.count(old_t) != 1:
              raise SystemExit("t count=%s" % script.count(old_t))
          script = script.replace(old_t, new_init, 1)

          start = script.find("  function applyStaticTranslations() {")
          end = script.find("  document.addEventListener(\"click\", function () {", start)
          if start < 0 or end < 0:
              raise SystemExit("applyStatic bounds missing")
          script = script[:start] + script[end:]

          old_fill = (
              "  function fillSwitchPrinciples() {\n"
              "    const items = [\n"
              "      t(\"switch_status_optional\"),\n"
              "      t(\"switch_cmsc\"),\n"
              "      t(\"switch_cr_structure\"),\n"
              "      t(\"switch_cr_frequency\"),\n"
              "      t(\"switch_best_option\")\n"
              "    ];\n"
              "    const html =\n"
              "      `<ul>${items.map((line) => `<li>${escapeHtml(line)}</li>`).join(\"\")}</ul>` +\n"
              "      `<div class=\"hint\">${escapeHtml(t(\"switch_brand_governance\"))}</div>`;\n"
              "    const top = document.getElementById(\"switchNonvalidated\");\n"
              "    const safety = document.getElementById(\"switchSafety\");\n"
              "    if (top) top.innerHTML = html;\n"
              "    if (safety) safety.innerHTML = html;\n"
              "  }\n"
              "\n"
          )
          if script.count(old_fill) != 1:
              raise SystemExit("fill count=%s" % script.count(old_fill))
          script = script.replace(old_fill, "", 1)

          if "window.ESUR.app.i18nApply.init" not in script:
              raise SystemExit("missing init")
          if "function t(key)" in script:
              raise SystemExit("t still declared")
          if "function applyStaticTranslations" in script:
              raise SystemExit("applyStatic still declared")
          if "function fillSwitchPrinciples" in script:
              raise SystemExit("fill still declared")
          if script.find("changesSearchInput = document.getElementById(\"changesSearch\")") > script.find("i18nApply.init"):
              raise SystemExit("init must follow changesSearchInput")
          if script.find("i18nApply.init") > script.find("function levelLabel"):
              raise SystemExit("init must precede levelLabel")
          Path("script.js").write_text(script, encoding="utf-8")

          index = Path("index.html").read_text(encoding="utf-8")
          if "./js/app/i18nApply.js" not in index:
              old_index = (
                  '<script src="./js/app/nav.js"></script>\n'
                  '<script src="./js/hsr/acute.js"></script>'
              )
              new_index = (
                  '<script src="./js/app/nav.js"></script>\n'
                  '<script src="./js/app/i18nApply.js"></script>\n'
                  '<script src="./js/hsr/acute.js"></script>'
              )
              if index.count(old_index) != 1:
                  raise SystemExit("index script block not found")
              Path("index.html").write_text(index.replace(old_index, new_index, 1), encoding="utf-8")
          PY
          grep -F "window.ESUR.app.i18nApply.init" script.js
          grep -F "./js/app/i18nApply.js" index.html
          if grep -F "function t(key)" script.js; then exit 1; fi
          if grep -F "function fillSwitchPrinciples" script.js; then exit 1; fi
      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r2f-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html .github/workflows/r2f-wire.yml
          git commit -m "ESUR_REFACTOR_R2F: extract static i18n apply shell"
          git push origin HEAD:refactor/modularize-script
