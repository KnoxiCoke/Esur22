name: Apply CSS safe area patch

on:
  push:
    branches:
      - codex/css-font-safe-area
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply CSS font and safe-area updates') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/css-font-safe-area
      - name: Patch style.css
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text()
          text = text.replace(
              'font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;',
              'font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;',
          )
          text = text.replace(
              '  padding: 10px;\n  background: rgba(15, 23, 40, 0.96);',
              '  padding: 10px;\n  padding-bottom: calc(10px + env(safe-area-inset-bottom));\n  background: rgba(15, 23, 40, 0.96);',
          )
          text = text.replace(
              '    padding: 6px 8px;\n  }\n\n   .bottomnav__btn',
              '    padding: 6px 8px;\n    padding-bottom: calc(6px + env(safe-area-inset-bottom));\n  }\n\n   .bottomnav__btn',
          )
          path.write_text(text)

          workflow = Path('.github/workflows/codex-css-safe-area.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/codex-css-safe-area.yml
          git commit -m "Apply CSS font and safe-area updates" || exit 0
          git push
