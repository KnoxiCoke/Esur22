name: Apply acute HSR management patch

on:
  push:
    branches:
      - codex/acute-hsr-management
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add acute HSR management module') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/acute-hsr-management
          fetch-depth: 2
      - name: Recover and run previous patch script
        run: |
          git show HEAD^:.github/workflows/codex-acute-hsr-management.yml > /tmp/previous-workflow.yml
          python3 <<'PY'
          from pathlib import Path
          source = Path('/tmp/previous-workflow.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = []
          for line in source[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_acute_hsr_patch.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_acute_hsr_patch.py
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css .github/workflows/codex-acute-hsr-management.yml
          git commit -m "Add acute HSR management module" || exit 0
          git push
