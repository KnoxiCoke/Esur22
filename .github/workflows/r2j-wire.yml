name: R2J Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2j-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire NIHR renderer into existing module
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path("script.js").read_text(encoding="utf-8")
          old_bind = "  const { renderNihrList } = window.ESUR.hsr.nihr;\n"
          if script.count(old_bind) != 1:
              raise SystemExit("bind count=%s" % script.count(old_bind))
          script = script.replace(old_bind, "", 1)

          start = script.find("  function renderNihr() {")
          end = script.find("    function getChanges() {")
          if start < 0 or end < 0:
              raise SystemExit("renderNihr bounds missing")
          old_fn = script[start:end]
          if old_fn.count("function renderNihr()") != 1:
              raise SystemExit("unexpected renderNihr block")
          new_fn = (
              "  const { renderNihr } = window.ESUR.hsr.nihr.init({\n"
              "    state,\n"
              "    t,\n"
              "    escapeHtml,\n"
              "    nihrOutput\n"
              "  });\n"
              "\n"
          )
          script = script[:start] + new_fn + script[end:]
          if "window.ESUR.hsr.nihr.init" not in script:
              raise SystemExit("missing init")
          if "function renderNihr" in script:
              raise SystemExit("declaration still present")
          if "const { renderNihrList }" in script:
              raise SystemExit("list bind still present")
          if "nihr_scope_guard" in script:
              raise SystemExit("scope guard still in host")
          if script.count("renderNihr();") != 2:
              raise SystemExit("call sites=%s" % script.count("renderNihr();"))
          if 'addEventListener("change", renderNihr)' not in script:
              raise SystemExit("checkbox listener missing")
          Path("script.js").write_text(script, encoding="utf-8")
          PY
          grep -F "window.ESUR.hsr.nihr.init" script.js
          if grep -F "function renderNihr" script.js; then exit 1; fi
          if grep -F "const { renderNihrList }" script.js; then exit 1; fi
      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r2j-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js js/hsr/nihr.js .github/workflows/r2j-wire.yml
          git commit -m "ESUR_REFACTOR_R2J: extract NIHR renderer into existing module"
          git push origin HEAD:refactor/modularize-script
