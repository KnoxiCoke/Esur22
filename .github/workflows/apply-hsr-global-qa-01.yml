name: Apply HSR_GLOBAL_QA_01

on:
  push:
    paths:
      - ".github/workflows/apply-hsr-global-qa-01.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply HSR_GLOBAL_QA_01
        run: python3 tools/apply_hsr_global_qa_01.py

      - name: Commit approved QA block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html
          if git diff --cached --quiet; then
            echo "no changes"
            exit 1
          fi
          git commit -m "HSR_GLOBAL_QA_01: tryptase blank validation, Part 2 referral/documentation block, IHR routing note, HSR fallback sync"

      - name: Remove temporary helper files and workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply_hsr_global_qa_01.py
          rm -f .github/workflows/apply-hsr-global-qa-01.yml
          rmdir tools 2>/dev/null || true
          git add -A
          git commit -m "Remove temporary HSR_GLOBAL_QA_01 helper files and workflow"
          git push
