name: Remove temporary cleanup workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-obsolete-modules.yml'

permissions:
  contents: write

jobs:
  remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-obsolete-modules.yml
          git commit -m "Remove temporary cleanup workflow"
          git push
