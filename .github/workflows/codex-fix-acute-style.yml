name: Clean acute style patch

on:
  push:
    branches:
      - codex/acute-hsr-management
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-style:
    if: ${{ !contains(github.event.head_commit.message, 'Clean acute HSR style diff') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/acute-hsr-management
          fetch-depth: 0
      - name: Preserve main style bytes and apply only HSR tab grid change
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          data = subprocess.check_output(['git', 'show', 'origin/main:style.css'])
          data = data.replace(
              b'.hsr-subnav {\n  grid-template-columns: repeat(4, 1fr);\n}',
              b'.hsr-subnav {\n  grid-template-columns: repeat(5, 1fr);\n}',
          )
          Path('style.css').write_bytes(data)
          Path('.github/workflows/codex-fix-acute-style.yml').unlink()
          PY
      - name: Commit style cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/codex-fix-acute-style.yml
          git commit -m "Clean acute HSR style diff" || exit 0
          git push
