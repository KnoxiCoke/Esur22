name: R2K Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2k-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire Acute renderer into existing module
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path("script.js").read_text(encoding="utf-8")
          start = script.find("  const { renderAcuteList } = window.ESUR.hsr.acute;")
          end = script.find("  const { renderSwitch }")
          if start < 0 or end < 0:
              raise SystemExit("bounds missing %s %s" % (start, end))
          old = script[start:end]
          if old.count("function renderAcuteManagement()") != 1:
              raise SystemExit("unexpected acute block")
          if old.count("const { renderAcuteList }") != 1:
              raise SystemExit("bind missing in block")
          new = (
              "  const { renderAcuteManagement } = window.ESUR.hsr.acute.init({\n"
              "    state,\n"
              "    t,\n"
              "    escapeHtml,\n"
              "    defaultAcutePattern,\n"
              "    acuteImmediateOutput,\n"
              "    acuteOutput\n"
              "  });\n"
              "\n"
          )
          script = script[:start] + new + script[end:]
          if "window.ESUR.hsr.acute.init" not in script:
              raise SystemExit("missing init")
          if "function renderAcuteManagement" in script:
              raise SystemExit("declaration still present")
          if "const { renderAcuteList }" in script:
              raise SystemExit("list bind still present")
          if "function defaultAcutePattern" not in script:
              raise SystemExit("defaultAcutePattern moved")
          if "function setSegment" not in script:
              raise SystemExit("setSegment missing")
          if script.count("renderAcuteManagement();") != 1:
              raise SystemExit("call sites=%s" % script.count("renderAcuteManagement();"))
          Path("script.js").write_text(script, encoding="utf-8")
          PY
          grep -F "window.ESUR.hsr.acute.init" script.js
          grep -n "function defaultAcutePattern" script.js
          if grep -F "function renderAcuteManagement" script.js; then exit 1; fi
          if grep -F "const { renderAcuteList }" script.js; then exit 1; fi
      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r2k-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js js/hsr/acute.js .github/workflows/r2k-wire.yml
          git commit -m "ESUR_REFACTOR_R2K: extract acute management renderer"
          git push origin HEAD:refactor/modularize-script
