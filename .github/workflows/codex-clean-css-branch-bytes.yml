name: Create byte-preserving CSS branch

on:
  push:
    branches:
      - codex/css-font-safe-area
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean branch with byte-preserving style.css patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B codex/css-font-safe-area-clean2 origin/main
          python3 <<'PY'
          from pathlib import Path

          path = Path('style.css')
          data = path.read_bytes()
          data = data.replace(
              b'font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;',
              b'font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;',
          )
          data = data.replace(
              b'  padding: 10px;\n  background: rgba(15, 23, 40, 0.96);',
              b'  padding: 10px;\n  padding-bottom: calc(10px + env(safe-area-inset-bottom));\n  background: rgba(15, 23, 40, 0.96);',
          )
          data = data.replace(
              b'    padding: 6px 8px;\n  }\n\n   .bottomnav__btn',
              b'    padding: 6px 8px;\n    padding-bottom: calc(6px + env(safe-area-inset-bottom));\n  }\n\n   .bottomnav__btn',
          )
          path.write_bytes(data)
          PY
          git add style.css
          git commit -m "Add font stack and bottom nav safe-area support"
          git push --force origin codex/css-font-safe-area-clean2
