name: R2C Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2c-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire renderAcuteList only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          text = p.read_text(encoding='utf-8')
          old = '  function renderAcuteList(items) {\n    return `<ul>${(items || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;\n  }\n'
          new = '  const { renderAcuteList } = window.ESUR.hsr.acute;\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one renderAcuteList block, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F 'const { renderAcuteList } = window.ESUR.hsr.acute;' script.js
          if grep -F 'function renderAcuteList(items)' script.js; then exit 1; fi
      - name: Commit wiring and remove helper
        shell: bash
        run: |
          rm .github/workflows/r2c-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows/r2c-wire.yml
          git commit -m "ESUR_REFACTOR_R2C_FIX: wire extracted acute list renderer"
          git push origin HEAD:refactor/modularize-script
