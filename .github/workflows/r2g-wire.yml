name: R2G Wire Helper

on:
  push:
    branches:
      - refactor/modularize-script
    paths:
      - .github/workflows/r2g-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-script
      - name: Wire previous-reaction flow renderer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = Path("script.js").read_text(encoding="utf-8")
          old = (
              "  function renderFlow() {\n"
              "    const key = `${state.situation}_${state.reaction}`;\n"
              "    const title = t(\"flow_titles\")[key];\n"
              "    const bullets = t(\"flow_bullets\")[key];\n"
              "\n"
              "    if (flowOutput) {\n"
              "      flowOutput.innerHTML = `\n"
              "        <div><strong>${escapeHtml(title)}</strong></div>\n"
              "        <ul>${bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join(\"\")}</ul>\n"
              "      `;\n"
              "    }\n"
              "\n"
              "    if (flowSafety) flowSafety.textContent = t(\"flow_safety\");\n"
              "  }\n"
              "\n"
          )
          new = (
              "  const { renderFlow } = window.ESUR.hsr.previous.init({\n"
              "    state,\n"
              "    t,\n"
              "    escapeHtml,\n"
              "    flowOutput,\n"
              "    flowSafety\n"
              "  });\n"
              "\n"
          )
          if script.count(old) != 1:
              raise SystemExit("renderFlow count=%s" % script.count(old))
          script = script.replace(old, new, 1)
          if "window.ESUR.hsr.previous.init" not in script:
              raise SystemExit("missing init")
          if "function renderFlow" in script:
              raise SystemExit("declaration still present")
          if "renderFlow();" not in script:
              raise SystemExit("call site missing")
          Path("script.js").write_text(script, encoding="utf-8")

          index = Path("index.html").read_text(encoding="utf-8")
          if "./js/hsr/previous.js" not in index:
              old_i = (
                  '<script src="./js/hsr/nihr.js"></script>\n'
                  '<script src="./script.js"></script>'
              )
              new_i = (
                  '<script src="./js/hsr/nihr.js"></script>\n'
                  '<script src="./js/hsr/previous.js"></script>\n'
                  '<script src="./script.js"></script>'
              )
              if index.count(old_i) != 1:
                  raise SystemExit("index script block not found")
              Path("index.html").write_text(index.replace(old_i, new_i, 1), encoding="utf-8")
          PY
          grep -F "window.ESUR.hsr.previous.init" script.js
          grep -F "./js/hsr/previous.js" index.html
          if grep -F "function renderFlow" script.js; then exit 1; fi
          grep -F "renderFlow();" script.js
      - name: Commit wiring and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r2g-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js index.html .github/workflows/r2g-wire.yml
          git commit -m "ESUR_REFACTOR_R2G: extract previous-reaction flow renderer"
          git push origin HEAD:refactor/modularize-script
