<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Radiology Contrast & Safety App</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <div class="topbar__title" data-i18n="app_title">Radiology Contrast & Safety App</div>
  </div>

  <div class="topbar__right">
    <div class="langswitch" aria-label="Language switch">
      <button class="langswitch__btn active" id="lang-en" type="button">EN</button>
      <button class="langswitch__btn" id="lang-de" type="button">DE</button>
    </div>
    <button class="topbar__reset" id="resetBtn" type="button" data-i18n="reset">Reset</button>
  </div>
</header>
</body>
</html>
